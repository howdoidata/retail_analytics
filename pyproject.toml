[project]
name = "retail_analytics"
version = "0.1.0"
description = "Flagship How Do I Data demo: synthetic retail data for Switchback Outfitters (fictional) -> dbt on DuckDB -> acquisition views by channel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5,<1.6",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.11,<1.12",
]

[project.scripts]
build = "retail_analytics.cli:build"
catalog = "retail_analytics.catalog:main"
generate = "retail_analytics.generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
