# Repo-local profile: run dbt with `--profiles-dir dbt`, never ~/.dbt.
# Relative paths resolve from the current directory (the repo root).
retail_analytics:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('RETAIL_DUCKDB_PATH', 'data/retail_analytics.duckdb') }}"
      schema: main
      threads: 4
