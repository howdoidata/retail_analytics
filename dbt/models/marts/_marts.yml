version: 2

models:
  - name: fct_signups_by_channel
    description: >
      Where customers come from: one row per acquisition channel and quarter. {{ doc("customer") }} Every
      channel in the `channels` seed has a row for every quarter from the first to the last quarter with a
      sign-up or spend, with 0 sign-ups and 0 spend where there were none. Reads only `dim_customers`,
      `int_channel_spend_daily`, and the `channels` seed. All values simulated.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['channel', 'quarter']
    columns:
      - name: channel
        description: '{{ doc("acquisition_channel") }} {{ doc("channel") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('channels')
                field: channel
      - name: quarter
        description: First day of the quarter (UTC).
        data_tests:
          - not_null
      - name: signups
        description: 'New customers acquired by the channel in the quarter. {{ doc("signup") }}'
        data_tests:
          - not_null
      - name: signups_prior_quarter
        description: >
          Sign-ups for the same channel in the previous quarter; 0 when it had none, null only in the first
          quarter of the data.
      - name: signups_change
        description: >
          Quarter-over-quarter change, (signups - signups_prior_quarter) / signups_prior_quarter, as a
          fraction (0.25 is 25% more); null when the prior quarter is null or 0.
      - name: share_of_signups
        description: >
          The channel's share of all sign-ups in the quarter, from 0 to 1; shares sum to 1 per quarter. Null
          when the quarter has no sign-ups.
      - name: ad_spend
        description: >
          {{ doc("ad_spend") }} Total for the channel and quarter, in dollars; 0 for channels with no spend.
        data_tests:
          - not_null
      - name: cost_per_signup
        description: >
          Simulated spend per sign-up, ad_spend / signups, in dollars; null when signups or ad_spend is 0.
      - name: is_simulated
        description: Always true. Every value in this mart is synthetic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false

  - name: fct_visit_funnel_by_channel
    description: >
      How fast customers convert: one row per acquisition channel, signup cohort month, and milestone, in long
      format, so a new milestone adds rows, never columns. {{ doc("customer") }} {{ doc("milestone") }}
      Milestone 0 is the signup. Every channel in the `channels` seed has a row for every milestone of every
      month from the first to the last month with a sign-up or spend, with 0 customers where there were none.
      Every cohort is kept, including ones too young to reach later milestones. To roll months up, sum
      customers_reached and ad_spend, recompute step_rate from the sums, and weight avg_days_from_previous by
      customers_reached. Reads only `dim_customers`, `int_channel_spend_daily`, and the `channels` seed. All
      values simulated.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['channel', 'cohort_month', 'milestone']
    columns:
      - name: channel
        description: '{{ doc("acquisition_channel") }} {{ doc("channel") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('channels')
                field: channel
      - name: cohort_month
        description: First day of the customers' signup month (UTC signup date).
        data_tests:
          - not_null
      - name: milestone
        description: >
          0 for the signup, else the visit number n of a milestone. {{ doc("milestone") }}
        data_tests:
          - not_null
      - name: previous_milestone
        description: >
          The step before this milestone in sorted order: 0 (signup) for the first visit milestone; null on
          the signup row.
      - name: customers_reached
        description: >
          Customers in the cohort who reached this milestone. On the signup row, the cohort size: every
          customer who signed up that month. {{ doc("signup") }} Never rises as the milestone rises.
        data_tests:
          - not_null
      - name: step_rate
        description: >
          {{ doc("step_rate") }} Null on the signup row and when no customer reached the previous step.
      - name: avg_days_from_previous
        description: >
          Mean calendar days from the previous milestone's date (the signup date for the first visit
          milestone) to this milestone's date, over the customers who reached this milestone; null on the
          signup row and when no customer reached it.
      - name: ad_spend
        description: >
          {{ doc("ad_spend") }} Total for the channel and month, in dollars, on the signup row only (0 when the
          channel had no spend); null on every other row, so summing the column never double counts.
      - name: is_simulated
        description: Always true. Every value in this mart is synthetic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false

  - name: fct_customer_cohorts
    description: >
      Whether customers stay: one row per acquisition channel, signup quarter, and quarters since signup, in
      long format, so a longer horizon adds rows, never columns. {{ doc("customer") }} {{ doc("cohort") }}
      Offsets run from 0 (the signup quarter) to the `cohort_horizon_quarters` variable (default 7); visits
      after the horizon are not counted. Every channel in the `channels` seed has a row for every quarter from
      the first to the last quarter with a sign-up and every offset whose quarter is not after the quarter
      the data ends (the latest signup or visit date), with 0 customers where there were none. Every cohort
      is kept, including ones too young to reach later offsets. The rows for the quarter the data ends in
      may cover only part of that quarter, so their active_rate can read low. Reads only `dim_customers`,
      `int_customer_visits`, and the `channels` seed. All values simulated.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['channel', 'cohort_quarter', 'quarters_since_signup']
    columns:
      - name: channel
        description: '{{ doc("acquisition_channel") }} {{ doc("channel") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('channels')
                field: channel
      - name: cohort_quarter
        description: First day of the customers' signup quarter (UTC signup date).
        data_tests:
          - not_null
      - name: quarters_since_signup
        description: >
          Calendar quarters from the signup quarter to this quarter: 0 for the signup quarter, up to the
          `cohort_horizon_quarters` variable. {{ doc("cohort") }}
        data_tests:
          - not_null
      - name: cohort_size
        description: >
          Customers in the cohort: every customer the channel acquired in the signup quarter, the same on
          every offset row. {{ doc("signup") }}
        data_tests:
          - not_null
      - name: active_customers
        description: >
          {{ doc("active_customer") }} Counted once each however many visits they made; never more than
          cohort_size.
        data_tests:
          - not_null
      - name: active_rate
        description: >
          active_customers / cohort_size, from 0 to 1; null when the cohort is empty.
      - name: visits
        description: >
          Visits by cohort customers in this quarter; 0 when none. {{ doc("visit") }}
        data_tests:
          - not_null
      - name: visits_per_active_customer
        description: visits / active_customers; null when no cohort customer visited in this quarter.
      - name: revenue
        description: >
          Sum of the order totals of those visits, in dollars (simulated); 0.00 when none.
        data_tests:
          - not_null
      - name: average_order
        description: revenue / visits, in dollars; null when there were no visits.
      - name: is_simulated
        description: Always true. Every value in this mart is synthetic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
