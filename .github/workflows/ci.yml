name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

jobs:
  test:
    name: Lint, test, dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

      # Compiles the dbt project against the repo-local profile; no database is needed.
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt

      # Fails when a source, seed, model, or declared (YAML) column has no description, or CATALOG.md is out
      # of date. YAML columns matching built columns is enforced by the layer tests run above.
      - name: Data catalog check
        run: uv run catalog --check

      # Runs the `generate` console script itself, so a broken entry point fails here.
      - name: Generate source CSVs
        run: uv run generate

      # The one-command run with no --vars: regenerates data/raw/, dbt builds and tests every layer, then
      # writes the mart CSVs to data/export/ (the last step, added by C-13).
      - name: Build the full pipeline
        run: uv run build

      # Runs the `export` console script itself, so a broken entry point fails here, and proves a second
      # export of the same database is byte-identical.
      - name: Export the marts again and check the bytes are identical
        run: |
          cp -R data/export "$RUNNER_TEMP/export-first"
          uv run export
          diff -r "$RUNNER_TEMP/export-first" data/export
